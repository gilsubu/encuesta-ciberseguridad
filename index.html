['frecuencia_actualizacion','10. ¿Con qué frecuencia actualiza el sistema operativo y las aplicaciones?','s',['Inmediatamente','Una vez al mes','Algunas veces al año','Solamente cuando es obligatorio','Nunca']],
['autoeval_ciberseguridad','11. ¿Cuál considera que es su nivel de conocimiento sobre ciberseguridad?','i',['1 Muy bajo','2 Bajo','3 Intermedio','4 Alto','5 Muy alto']]]],
['Sección C. Incidentes de seguridad',[
['phishing_30d','12. Durante los últimos 30 días, ¿cuántos mensajes o correos sospechosos de fraude o phishing ha recibido? (número entero)','n',{min:0,max:500,int:1}],
['incidente_12m','13. Durante los últimos 12 meses, ¿ha sufrido algún incidente de seguridad digital?','s',SN],
['tipo_incidente','14. ¿Qué tipo de incidente sufrió?','s',['Acceso no autorizado a una cuenta','Robo o pérdida de contraseña','Virus o software malicioso','Fraude o engaño digital','Pérdida de información','Otro']],
['num_incidentes_12m','15. ¿Cuántos incidentes de seguridad digital ha sufrido durante los últimos 12 meses? (número entero)','n',{min:1,max:100,int:1}]]],
['Sección D. Prueba corta de conocimientos',[
['resp_p16','16. Recibe un correo que solicita ingresar urgentemente a un enlace para evitar el bloqueo de su cuenta. ¿Qué haría primero?','i',['Abrir el enlace inmediatamente','Responder al correo','Verificar el remitente y acceder directamente al sitio oficial','Reenviar el correo a otras personas']],
['resp_p17','17. ¿Cuál de las siguientes contraseñas es más segura?','i',['sistemas123','Guatemala2026','123456789','Luna-Café7!Bosque']],
['resp_p18','18. ¿Para qué sirve principalmente la autenticación de dos factores?','i',['Aumentar la velocidad de Internet','Agregar una segunda verificación de identidad','Eliminar virus','Guardar automáticamente las contraseñas']],
['resp_p19','19. ¿Qué debería hacer antes de instalar un programa descargado de Internet?','i',['Desactivar el antivirus','Verificar que provenga de una fuente confiable','Compartirlo con otras personas','Ejecutarlo como administrador inmediatamente']],
['resp_p20','20. ¿Cuál es una señal frecuente de un posible intento de phishing?','i',['Dirección oficial verificada','Mensaje urgente con enlace sospechoso','Solicitud de actualización del sistema operativo','Página guardada en favoritos']]]]];
const TITLES={};Q.forEach(s=>s[1].forEach(f=>TITLES[f[0]]=f[1]));
const $=id=>document.getElementById(id);
const el=(t,p={},k=[])=>{const e=document.createElement(t);Object.assign(e,p);k.forEach(c=>e.append(c));return e};
let mine=null,msg='';

function show(v){$('vF').hidden=v!=='F';$('vV').hidden=v!=='V';$('bF').className=v==='F'?'on':'';$('bV').className=v==='V'?'on':''}
$('bF').onclick=()=>show('F');$('bV').onclick=()=>show('V');

/* ---------- formulario ---------- */
const form=el('form');form.noValidate=true;
const inp={};
Q.forEach(([title,fs])=>{
  const g=el('div',{className:'grid'});
  fs.forEach(([k,lab,t,o])=>{
    let c;
    if(t==='n'){c=el('input',{type:'number',min:o.min,max:o.max,step:o.int?1:'any',inputMode:o.int?'numeric':'decimal'})}
    else{c=el('select',{},[el('option',{value:'',textContent:'Selecciona…'}),...o.map((x,i)=>el('option',{value:t==='i'?String(i+1):x,textContent:x}))])}
    inp[k]={c,t,o,lab,box:el('label',{},[el('span',{textContent:lab}),c])};
    g.append(inp[k].box);
  });
  form.append(el('fieldset',{},[el('legend',{textContent:title}),g]));
});
function sync(){const si=inp.incidente_12m.c.value==='Sí';['tipo_incidente','num_incidentes_12m'].forEach(k=>{inp[k].box.hidden=!si})}
inp.incidente_12m.c.onchange=sync;sync();
const err=el('div',{className:'err',role:'alert'});
form.append(err,el('button',{type:'submit',className:'go',textContent:'Enviar respuesta'}));
$('vF').append(form);

form.onsubmit=e=>{
  e.preventDefault();err.textContent='';
  const si=inp.incidente_12m.c.value==='Sí',row=[81];
  for(const k of COLS.slice(1)){
    const f=inp[k];
    if(!si&&k==='tipo_incidente'){row.push('Ninguno');continue}
    if(!si&&k==='num_incidentes_12m'){row.push(0);continue}
    const v=f.c.value.trim();
    if(v===''){err.textContent='Falta responder: '+f.lab;f.c.focus();return}
    if(f.t==='n'){const x=Number(v);
      if(!isFinite(x)||x<f.o.min||x>f.o.max||(f.o.int&&!Number.isInteger(x))){err.textContent='Valor no válido en: '+f.lab+' (entre '+f.o.min+' y '+f.o.max+')';f.c.focus();return}
      row.push(x)}
    else row.push(f.t==='i'?Number(v):v);
  }
  mine=row;msg='Tu respuesta aparece como el registro 81.';
  form.reset();sync();render();show('V');
  const m=document.querySelector('#vV tr.mine');if(m)m.scrollIntoView({block:'center'});
};

/* ---------- tabla ---------- */
const q=el('input',{type:'search',placeholder:'Buscar en todas las columnas…'});q.oninput=()=>render();
const cnt=el('span');
const okBox=el('div',{className:'ok'});okBox.hidden=true;
const wrap=el('div',{className:'wrap'});
$('vV').append(okBox,el('div',{className:'tools'},[q,cnt]),wrap);

function render(){
  const all=mine?[...DATA,mine]:DATA;
  cnt.replaceChildren(el('b',{textContent:String(all.length)}),' registros');
  okBox.hidden=!msg;okBox.textContent=msg;
  const t=q.value.trim().toLowerCase();
  const rows=all.filter(r=>!t||r.some(v=>String(v).toLowerCase().includes(t)));
  const tb=el('table'),hd=el('tr');
  COLS.forEach(c=>hd.append(el('th',{textContent:c,title:TITLES[c]||'Número de registro'})));
  tb.append(el('thead',{},[hd]));
  const bd=el('tbody');
  rows.forEach(r=>bd.append(el('tr',{className:r===mine?'mine':''},r.map(v=>el('td',{textContent:v})))));
  tb.append(bd);wrap.replaceChildren(tb);
}
render();
</script>
</body>
</html>
